name: Protocol evolution

on:
  pull_request:
    paths:
      - automation/**
      - .github/workflows/protocol-evolution.yml
      - tests/protocol-evolution.test.mjs
      - tests/protocol-issues.test.mjs
      - vitest.config.ts
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-evolution-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'default' }}
  cancel-in-progress: false

jobs:
  discovery-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify upstream discovery
        run: node automation/protocol-evolution.mjs discover --out "$RUNNER_TEMP/protocol-discovery.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-discovery-smoke
          path: ${{ runner.temp }}/protocol-discovery.json
          if-no-files-found: ignore

  reconcile:
    if: github.event_name != 'pull_request'
    name: Detect, evaluate and propose protocol refresh
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      HAS_UPDATE_TOKEN: ${{ secrets.PROTOCOL_UPDATE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install pinned simulator
        run: pnpm install --frozen-lockfile

      - name: Discover upstream protocol/SDK revisions
        id: discovery
        run: |
          node automation/protocol-evolution.mjs discover \
            --out "$RUNNER_TEMP/protocol-discovery.json"

      - name: Save independent baseline
        if: steps.discovery.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/protocol-baseline"
          cp -R protocol "$RUNNER_TEMP/protocol-baseline/protocol"
          cp package.json "$RUNNER_TEMP/protocol-baseline/package.json"

      - name: Refresh exact upstream snapshots and SDKs
        id: refresh
        if: steps.discovery.outputs.changed == 'true'
        env:
          OPENAI_REF: ${{ steps.discovery.outputs.openai_sha }}
          ANTHROPIC_VERSION: ${{ steps.discovery.outputs.anthropic_version }}
          OPENAI_SDK_VERSION: ${{ steps.discovery.outputs.openai_version }}
          UPDATE_OPENAI: ${{ steps.discovery.outputs.update_openai }}
          UPDATE_ANTHROPIC: ${{ steps.discovery.outputs.update_anthropic }}
          UPDATE_OPENAI_SDK: ${{ steps.discovery.outputs.update_openai_sdk }}
        run: |
          set -euo pipefail
          if [ "$UPDATE_ANTHROPIC" = 'true' ]; then
            pnpm add --save-dev --save-exact "anthropic-sdk@npm:@anthropic-ai/sdk@$ANTHROPIC_VERSION"
            pnpm protocol:refresh:anthropic
          fi
          if [ "$UPDATE_OPENAI_SDK" = 'true' ]; then
            pnpm add --save-dev --save-exact "openai@$OPENAI_SDK_VERSION"
          fi
          if [ "$UPDATE_OPENAI" = 'true' ]; then
            pnpm protocol:refresh:openai --ref "$OPENAI_REF"
          fi
          pnpm protocol:generate

      # All metrics are strictly simulator-owned. Run independent gates even
      # when another gate fails, so the failure report can show the complete matrix.
      - name: Metric / typecheck
        id: typecheck
        if: always() && steps.refresh.outcome == 'success'
        run: pnpm typecheck 2>&1 | tee "$RUNNER_TEMP/protocol-typecheck.log"
        shell: bash

      - name: Metric / SDK, stream, state and regression tests
        id: simulator_tests
        if: always() && steps.refresh.outcome == 'success'
        run: pnpm test 2>&1 | tee "$RUNNER_TEMP/protocol-tests.log"
        shell: bash

      - name: Metric / protocol manifest and snapshot integrity
        id: protocol_check
        if: always() && steps.refresh.outcome == 'success'
        run: pnpm protocol:check 2>&1 | tee "$RUNNER_TEMP/protocol-contract.log"
        shell: bash

      - name: Metric / schema branches and transitions
        id: coverage_check
        if: always() && steps.refresh.outcome == 'success'
        run: pnpm coverage:check 2>&1 | tee "$RUNNER_TEMP/protocol-coverage.log"
        shell: bash

      - name: Metric / package build
        id: build
        if: always() && steps.refresh.outcome == 'success'
        run: pnpm build 2>&1 | tee "$RUNNER_TEMP/protocol-build.log"
        shell: bash

      - name: Record five independently observed gate outcomes
        id: gates
        if: always() && steps.discovery.outputs.changed == 'true'
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TESTS: ${{ steps.simulator_tests.outcome }}
          PROTOCOL: ${{ steps.protocol_check.outcome }}
          COVERAGE: ${{ steps.coverage_check.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          node -e '
            const fs = require("node:fs");
            const names = {
              "typecheck": process.env.TYPECHECK,
              "simulator-tests": process.env.TESTS,
              "protocol-check": process.env.PROTOCOL,
              "coverage-check": process.env.COVERAGE,
              "build": process.env.BUILD,
            };
            const result = Object.fromEntries(
              Object.entries(names).map(([key,value])=>[key,value === "success" ? "passed" : value || "missing"])
            );
            fs.writeFileSync(process.env.RUNNER_TEMP + "/protocol-gates.json", JSON.stringify(result,null,2)+"\n");
          '

      - name: Evaluate compatibility and semantic risk
        id: evaluation
        if: always() && steps.refresh.outcome == 'success' && steps.gates.outcome == 'success'
        run: |
          node automation/protocol-evolution.mjs evaluate \
            --baseline "$RUNNER_TEMP/protocol-baseline" \
            --discovery "$RUNNER_TEMP/protocol-discovery.json" \
            --gates "$RUNNER_TEMP/protocol-gates.json" \
            --out "$RUNNER_TEMP/protocol-evaluation.json" \
            --markdown "$RUNNER_TEMP/protocol-evaluation.md"

      - name: Publish metric summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/protocol-evaluation.md" ]; then
            cat "$RUNNER_TEMP/protocol-evaluation.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence for successful and failed evaluations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-evolution-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/protocol-discovery.json
            ${{ runner.temp }}/protocol-gates.json
            ${{ runner.temp }}/protocol-evaluation.json
            ${{ runner.temp }}/protocol-evaluation.md
            ${{ runner.temp }}/protocol-*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Maintain one candidate protocol update PR
        if: steps.discovery.outputs.changed == 'true' && steps.evaluation.outcome == 'success'
        uses: peter-evans/create-pull-request@v8
        id: candidate
        with:
          token: ${{ secrets.PROTOCOL_UPDATE_TOKEN || github.token }}
          branch: automation/upstream-protocol-refresh
          base: main
          delete-branch: true
          title: 'chore(protocol): reconcile latest upstream contracts'
          body-path: ${{ runner.temp }}/protocol-evaluation.md
          commit-message: 'chore(protocol): refresh protocol snapshots after compatibility eval'
          add-paths: |
            package.json
            pnpm-lock.yaml
            protocol/**

      - name: Promote safe candidate after GitHub PR checks (opt in)
        if: >-
          steps.candidate.outputs.pull-request-number != '' &&
          steps.evaluation.outputs.safe == 'true' &&
          vars.PROTOCOL_AUTO_PROMOTE == 'true' &&
          env.HAS_UPDATE_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROTOCOL_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          gh pr checks "$PR_NUMBER" --watch --fail-fast
          gh pr merge "$PR_NUMBER" --squash --delete-branch

      # Also reports "review" verdicts; these are not CI failures but do
      # represent an unresolved protocol compatibility change.
      - name: Create, update or resolve protocol anomaly Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROTOCOL_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROTOCOL_JOB_STATUS: ${{ job.status }}
          PROTOCOL_DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
          PROTOCOL_REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          PROTOCOL_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          PROTOCOL_TESTS_OUTCOME: ${{ steps.simulator_tests.outcome }}
          PROTOCOL_PROTOCOL_CHECK_OUTCOME: ${{ steps.protocol_check.outcome }}
          PROTOCOL_COVERAGE_OUTCOME: ${{ steps.coverage_check.outcome }}
          PROTOCOL_BUILD_OUTCOME: ${{ steps.build.outcome }}
          PROTOCOL_EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
          PROTOCOL_CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          PROTOCOL_PROMOTION_OUTCOME: ${{ steps.promotion.outcome }}
          PROTOCOL_CANDIDATE_NUMBER: ${{ steps.candidate.outputs.pull-request-number }}
        run: |
          node automation/protocol-issues.mjs \
            --discovery "$RUNNER_TEMP/protocol-discovery.json" \
            --evaluation "$RUNNER_TEMP/protocol-evaluation.json"
